name: Build offline wheels - Win10 x64 - Python 3.11.9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: windows-2022
    steps:
      - name: Setup Python 3.11.9 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          architecture: "x64"

      - name: Download all wheels and dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "offline_bundle\wheelhouse" | Out-Null
          @"
          Flask==3.1.3
          Werkzeug==3.1.6
          mobi==0.4.1
          beautifulsoup4==4.15.0
          waitress==3.0.2
          PyMuPDF==1.26.7
          python-docx==1.2.0
          striprtf==0.0.32
          "@ | Set-Content "offline_bundle\requirements.txt" -Encoding ascii

          python -m pip install --upgrade pip setuptools wheel
          python -m pip download --only-binary=:all: --dest "offline_bundle\wheelhouse" pip setuptools wheel
          python -m pip download --only-binary=:all: --dest "offline_bundle\wheelhouse" --requirement "offline_bundle\requirements.txt"

      - name: Create installer
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          where py >nul 2>nul || (echo Can Python 3.11.9 x64. & pause & exit /b 1)
          py -3.11 -c "import sys; assert sys.version_info[:2] == (3,11)" || (pause & exit /b 1)
          if not exist ".venv\Scripts\python.exe" py -3.11 -m venv .venv
          ".venv\Scripts\python.exe" -m pip install --no-index --find-links="%CD%\wheelhouse" pip setuptools wheel || goto :error
          ".venv\Scripts\python.exe" -m pip install --no-index --find-links="%CD%\wheelhouse" -r requirements.txt || goto :error
          ".venv\Scripts\python.exe" -m pip check || goto :error
          echo [OK] Cai offline thanh cong.
          pause
          exit /b 0
          :error
          echo [LOI] Cai dat that bai.
          pause
          exit /b 1
          '@ | Set-Content "offline_bundle\install_offline.bat" -Encoding ascii

      - name: Verify offline bundle
        shell: pwsh
        run: |
          python -m venv verify_venv
          .\verify_venv\Scripts\python.exe -m pip install --no-index --find-links="$PWD\offline_bundle\wheelhouse" -r "$PWD\offline_bundle\requirements.txt"
          .\verify_venv\Scripts\python.exe -m pip check
          .\verify_venv\Scripts\python.exe -c "import flask,mobi,bs4,waitress,pymupdf,docx,striprtf; print('IMPORT OK')"

      - name: Make manifest
        shell: pwsh
        run: |
          Get-ChildItem "offline_bundle\wheelhouse" -File | Sort-Object Name | Select-Object -ExpandProperty Name | Set-Content "offline_bundle\WHEEL-LIST.txt" -Encoding utf8
          Get-ChildItem "offline_bundle\wheelhouse" -File | Sort-Object Name | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content "offline_bundle\SHA256SUMS.txt" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-reader-wheelhouse-win10-x64-py3119
          path: offline_bundle
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          
