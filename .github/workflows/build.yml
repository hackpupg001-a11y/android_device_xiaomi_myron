name: Build SpecialReloadClient - Akira LLVM17 Hardened

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive file ID hoặc link chia sẻ ZIP source SpecialReloadClient"
        required: true
        type: string

      build_config:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - "Release"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    # LLVM build lần đầu khá nặng.
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    env:
      AKIRA_REPO: https://github.com/thomasxm/Akira-obfuscator.git

      # Cache version:
      # đổi số này nếu muốn ép rebuild toàn bộ Akira.
      AKIRA_CACHE_VERSION: v1

      # Obfuscation Akira.
      #
      # irobf-indbr = indirect branches
      # irobf-icall = indirect calls
      # irobf-indgv = indirect globals
      # irobf-cse   = C string encryption
      # irobf-cff   = control-flow flattening
      #
      # -irobf bật framework Akira.
      AKIRA_FLAGS: >-
        -mllvm -irobf
        -mllvm -irobf-indbr
        -mllvm -irobf-icall
        -mllvm -irobf-indgv
        -mllvm -irobf-cse
        -mllvm -irobf-cff

    steps:

      # ============================================================
      # 1. TOOLS
      # ============================================================

      - name: Show runner information
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "OS:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Ninja:"
          ninja --version

          Write-Host ""
          Write-Host "Git:"
          git --version

          Write-Host ""
          Write-Host "Python:"
          python --version

      - name: Install gdown
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install --upgrade pip
          python -m pip install "gdown>=5.2,<6"

      # ============================================================
      # 2. LOCATE VISUAL STUDIO
      # ============================================================

      - name: Locate Visual Studio 2022
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path `
            ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'

          if (!(Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe không tồn tại."
          }

          $vsPath = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Không tìm thấy Visual Studio 2022 C++ toolchain."
          }

          $vcvars = Join-Path `
            $vsPath `
            'VC\Auxiliary\Build\vcvars64.bat'

          if (!(Test-Path -LiteralPath $vcvars)) {
            throw "Không tìm thấy vcvars64.bat."
          }

          "VS_PATH=$vsPath" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "VCVARS64=$vcvars" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Visual Studio:"
          Write-Host $vsPath

      # ============================================================
      # 3. IMPORT VS x64 ENVIRONMENT
      # ============================================================

      - name: Initialize VS2022 x64 environment
        run: |
          $ErrorActionPreference = 'Stop'

          $tempFile = Join-Path `
            $env:RUNNER_TEMP `
            'vs_env.txt'

          cmd.exe /c "`"$env:VCVARS64`" >nul && set" |
            Out-File `
              -LiteralPath $tempFile `
              -Encoding ascii

          foreach ($line in Get-Content -LiteralPath $tempFile) {

            if ($line -notmatch '=') {
              continue
            }

            $parts = $line -split '=', 2

            if ($parts.Count -ne 2) {
              continue
            }

            $name  = $parts[0]
            $value = $parts[1]

            if ([string]::IsNullOrWhiteSpace($name)) {
              continue
            }

            # GITHUB_ENV format.
            "$name=$value" |
              Out-File `
                $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
          }

          Remove-Item `
            -LiteralPath $tempFile `
            -Force

      # ============================================================
      # 4. AKIRA COMPILER CACHE
      # ============================================================

      - name: Restore Akira LLVM17 cache
        id: akira-cache
        uses: actions/cache@v4
        with:
          path: C:\AkiraLLVM17
          key: akira-llvm17-windows2022-${{ env.AKIRA_CACHE_VERSION }}

      # ============================================================
      # 5. BUILD AKIRA IF CACHE MISSES
      # ============================================================

      - name: Clone Akira LLVM17
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path `
            $env:GITHUB_WORKSPACE `
            'akira-src'

          if (Test-Path -LiteralPath $src) {
            Remove-Item `
              -LiteralPath $src `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            $env:AKIRA_REPO `
            $src

          if ($LASTEXITCODE -ne 0) {
            throw "Clone Akira thất bại."
          }

          Set-Location -LiteralPath $src

          $commit = git rev-parse HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Không lấy được Akira commit."
          }

          "AKIRA_COMMIT=$commit" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Akira commit: $commit"

      - name: Patch Akira Windows compile issue if required
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $crypto = Join-Path `
            $env:GITHUB_WORKSPACE `
            'akira-src\llvm\lib\Transforms\Obfuscation\CryptoUtils.cpp'

          if (Test-Path -LiteralPath $crypto) {

            $text = Get-Content `
              -LiteralPath $crypto `
              -Raw

            if (
              $text -match 'std::ifstream' -and
              $text -notmatch '#include\s*<fstream>'
            ) {
              Write-Host "Adding missing <fstream> include..."

              $text = "#include <fstream>`r`n" + $text

              Set-Content `
                -LiteralPath $crypto `
                -Value $text `
                -Encoding utf8
            }
          }

      - name: Configure Akira LLVM17
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path `
            $env:GITHUB_WORKSPACE `
            'akira-src'

          $build = Join-Path `
            $env:GITHUB_WORKSPACE `
            'akira-build'

          if (Test-Path -LiteralPath $build) {
            Remove-Item `
              -LiteralPath $build `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $build `
            -Force |
            Out-Null

          cmake `
            -S (Join-Path $src 'llvm') `
            -B $build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="/utf-8" `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_ENABLE_PROJECTS="clang;lld" `
            -DLLVM_TARGETS_TO_BUILD="X86" `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_BUILD_TESTS=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF

          if ($LASTEXITCODE -ne 0) {
            throw "Configure Akira LLVM17 thất bại."
          }

      - name: Build Akira LLVM17
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $build = Join-Path `
            $env:GITHUB_WORKSPACE `
            'akira-build'

          # Chỉ build compiler/linker cần thiết,
          # không build toàn bộ LLVM + LLDB.
          cmake `
            --build $build `
            --target clang clang-cl lld lld-link `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Build Akira LLVM17 thất bại."
          }

      - name: Install Akira compiler
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $build = Join-Path `
            $env:GITHUB_WORKSPACE `
            'akira-build'

          $dest = 'C:\AkiraLLVM17'

          if (Test-Path -LiteralPath $dest) {
            Remove-Item `
              -LiteralPath $dest `
              -Recurse `
              -Force
          }

          New-Item `
            -ItemType Directory `
            -Path (Join-Path $dest 'bin') `
            -Force |
            Out-Null

          $required = @(
            'clang.exe',
            'clang-cl.exe',
            'lld.exe',
            'lld-link.exe'
          )

          foreach ($file in $required) {

            $src = Join-Path `
              $build `
              "bin\$file"

            if (!(Test-Path -LiteralPath $src)) {
              throw "Compiler Akira thiếu $file"
            }

            Copy-Item `
              -LiteralPath $src `
              -Destination (Join-Path $dest 'bin') `
              -Force
          }

          # Copy DLL runtime/compiler DLL dependencies.
          Get-ChildItem `
            -LiteralPath (Join-Path $build 'bin') `
            -Filter '*.dll' `
            -File `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination (Join-Path $dest 'bin') `
                -Force
            }

          $commit = $env:AKIRA_COMMIT

          if ([string]::IsNullOrWhiteSpace($commit)) {
            $commit = 'unknown'
          }

          $commit |
            Out-File `
              (Join-Path $dest 'AKIRA_COMMIT.txt') `
              -Encoding ascii

      # ============================================================
      # 6. VERIFY AKIRA COMPILER
      # ============================================================

      - name: Verify Akira compiler
        run: |
          $ErrorActionPreference = 'Stop'

          $clang = 'C:\AkiraLLVM17\bin\clang.exe'
          $clangcl = 'C:\AkiraLLVM17\bin\clang-cl.exe'

          if (!(Test-Path -LiteralPath $clang)) {
            throw "Akira clang.exe không tồn tại."
          }

          if (!(Test-Path -LiteralPath $clangcl)) {
            throw "Akira clang-cl.exe không tồn tại."
          }

          & $clangcl --version

          if ($LASTEXITCODE -ne 0) {
            throw "Akira clang-cl không chạy được."
          }

          "AKIRA_CLANG=$clang" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "AKIRA_CLANGCL=$clangcl" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

      # ============================================================
      # 7. TEST THAT AKIRA PASSES ACTUALLY EXIST
      #
      # Quan trọng:
      # không chỉ kiểm tra clang-cl chạy được;
      # phải chứng minh binary compiler có các Akira pass.
      # ============================================================

      - name: Verify Akira obfuscation passes
        run: |
          $ErrorActionPreference = 'Stop'

          $testDir = Join-Path `
            $env:RUNNER_TEMP `
            'akira-pass-test'

          New-Item `
            -ItemType Directory `
            -Path $testDir `
            -Force |
            Out-Null

          $testCpp = Join-Path `
            $testDir `
            'test.cpp'

          @'
          volatile int g_value = 123;

          __declspec(noinline)
          int test_function(int x)
          {
              const char* text = "AKIRA_PASS_TEST";

              if (x > 50)
                  return g_value + text[0];

              return x * 7;
          }

          int main()
          {
              return test_function(42);
          }
          '@ |
            Out-File `
              -LiteralPath $testCpp `
              -Encoding ascii

          Push-Location $testDir

          try {

            & $env:AKIRA_CLANGCL `
              /nologo `
              /O2 `
              /EHsc `
              /Fe:akira_test.exe `
              $testCpp `
              -mllvm -irobf `
              -mllvm -irobf-indbr `
              -mllvm -irobf-icall `
              -mllvm -irobf-indgv `
              -mllvm -irobf-cse `
              -mllvm -irobf-cff

            if ($LASTEXITCODE -ne 0) {
              throw "Akira obfuscation pass test thất bại."
            }

            if (!(Test-Path -LiteralPath 'akira_test.exe')) {
              throw "Không tạo được Akira test EXE."
            }

            Write-Host "Akira obfuscation passes: OK"
          }
          finally {
            Pop-Location
          }

      # ============================================================
      # 8. DOWNLOAD PROJECT
      # ============================================================

      - name: Download source ZIP from Google Drive
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          $ErrorActionPreference = 'Stop'

          $driveInput = $env:DRIVE_URL.Trim()

          if ([string]::IsNullOrWhiteSpace($driveInput)) {
            throw "Google Drive input rỗng."
          }

          if ($driveInput -match '^[A-Za-z0-9_-]{20,}$') {
            $fileId = $driveInput
          }
          elseif ($driveInput -match '/d/([A-Za-z0-9_-]+)') {
            $fileId = $Matches[1]
          }
          elseif ($driveInput -match '[?&]id=([A-Za-z0-9_-]+)') {
            $fileId = $Matches[1]
          }
          else {
            throw "Không lấy được Google Drive file ID."
          }

          python -c @"
          import gdown
          import os
          import sys

          fid = sys.argv[1]

          p = gdown.download(
              id=fid,
              output='source.zip',
              quiet=False
          )

          if not p:
              raise SystemExit(1)

          if not os.path.isfile(p):
              raise SystemExit(2)

          if os.path.getsize(p) <= 1024:
              raise SystemExit(3)
          "@ "$fileId"

          if ($LASTEXITCODE -ne 0) {
            throw "Download source.zip thất bại."
          }

          if (!(Test-Path -LiteralPath 'source.zip')) {
            throw "source.zip không tồn tại."
          }

          $sourceHash = Get-FileHash `
            -LiteralPath 'source.zip' `
            -Algorithm SHA256

          "SOURCE_ZIP_SHA256=$($sourceHash.Hash)" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Source ZIP SHA256:"
          Write-Host $sourceHash.Hash

          # Validate ZIP.
          Add-Type `
            -AssemblyName System.IO.Compression.FileSystem

          try {
            $zip = [System.IO.Compression.ZipFile]::OpenRead(
              (Resolve-Path 'source.zip')
            )

            $count = $zip.Entries.Count
            $zip.Dispose()

            if ($count -lt 1) {
              throw "ZIP rỗng."
            }
          }
          catch {
            throw "ZIP không hợp lệ: $($_.Exception.Message)"
          }

          if (Test-Path -LiteralPath 'source') {
            Remove-Item `
              -LiteralPath 'source' `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -LiteralPath 'source.zip' `
            -DestinationPath 'source' `
            -Force

      # ============================================================
      # 9. LOCATE PROJECT
      # ============================================================

      - name: Locate SpecialReloadClient project
        run: |
          $ErrorActionPreference = 'Stop'

          $cmake = Get-ChildItem `
            -LiteralPath 'source' `
            -Filter 'CMakeLists.txt' `
            -File `
            -Recurse |
            Where-Object {

              $_.FullName -notmatch `
                '[\\/](build|\.git|out|cmake-build-[^\\/]+)[\\/]' `
              -and

              (
                Test-Path `
                  -LiteralPath (
                    Join-Path `
                      $_.Directory.FullName `
                      'SpecialReloadClient.cpp'
                  )
              )

            } |
            Sort-Object {
              $_.FullName.Length
            } |
            Select-Object -First 1

          if ($null -eq $cmake) {
            throw (
              "Không tìm thấy CMakeLists.txt cạnh " +
              "SpecialReloadClient.cpp."
            )
          }

          $project = $cmake.Directory.FullName

          "PROJECT_DIR=$project" |
            Out-File `
              $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Project:"
          Write-Host $project

      # ============================================================
      # 10. SOURCE HARDENING GATE
      # ============================================================

      - name: Verify hardened source
        run: |
          $ErrorActionPreference = 'Stop'

          Set-Location `
            -LiteralPath $env:PROJECT_DIR

          foreach ($file in @(
            'SpecialReloadClient.cpp',
            'StringObf.h',
            'AntiDebug.h'
          )) {

            if (!(Test-Path -LiteralPath $file)) {
              throw (
                "Thiếu $file - source không phải hardened build."
              )
            }
          }

          $cpp = Get-Content `
            -LiteralPath 'SpecialReloadClient.cpp' `
            -Raw

          $requirements = @(
            'StringObf.h',
            'AntiDebug.h',
            'OBF("/api/specialreload/register")'
          )

          foreach ($needle in $requirements) {

            if (!$cpp.Contains($needle)) {
              throw "Hardening requirement thiếu: $needle"
            }
          }

          Write-Host "Source hardening gate: OK"

      # ============================================================
      # 11. CONFIGURE PROJECT WITH AKIRA CLANG-CL
      #
      # Ninja được dùng thay Visual Studio generator để chắc chắn
      # CMake sử dụng đúng custom clang-cl của Akira.
      # ============================================================

      - name: Configure with Akira clang-cl
        run: |
          $ErrorActionPreference = 'Stop'

          Set-Location `
            -LiteralPath $env:PROJECT_DIR

          if (Test-Path -LiteralPath 'build') {
            Remove-Item `
              -LiteralPath 'build' `
              -Recurse `
              -Force
          }

          $flags = $env:AKIRA_FLAGS.Trim()

          Write-Host "Akira flags:"
          Write-Host $flags

          cmake `
            -S . `
            -B build `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=${{ inputs.build_config }}" `
            "-DCMAKE_C_COMPILER=$env:AKIRA_CLANGCL" `
            "-DCMAKE_CXX_COMPILER=$env:AKIRA_CLANGCL" `
            "-
