name: Build SpecialReloadClient - Akira LLVM17 PRECHECKED v16

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive file ID hoặc link chia sẻ ZIP source SpecialReloadClient (C++)"
        required: true
        type: string
      build_config:
        description: "Cấu hình build"
        required: true
        default: "Release"
        type: choice
        options:
          - "Release"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 240

    defaults:
      run:
        shell: pwsh

    env:
      # Pin Akira tại commit đã kiểm tra, tránh main thay đổi làm lệch toolchain.
      AKIRA_REPO: https://github.com/thomasxm/Akira-obfuscator.git
      AKIRA_COMMIT: 112e63dadff9d1b81a65b24b1a16a03f56d63a0f
      AKIRA_INSTALL: C:\AkiraLLVM17

      # Akira này là LLVM/Clang 17. Dùng Build Tools 17.8 riêng để có
      # MSVC 14.38 STL tương thích, thay vì modify VS Enterprise mới
      # đang có sẵn trên GitHub runner.
      VS178_INSTALL: C:\VS2022BT178
      VS178_BOOTSTRAPPER_URL: https://download.visualstudio.microsoft.com/download/pr/ac0cb103-349c-4207-8b60-334952278a84/217310512fc5113ad70547200f13d42b94a4476be5ef77cfd54aba74f82c59aa/vs_BuildTools.exe
      MSVC_TOOLSET_VERSION: "14.38"

      # Đổi số này khi muốn ép GitHub Actions rebuild cache compiler.
      AKIRA_CACHE_VERSION: v7

      # Các pass Akira đang hỗ trợ:
      # - indirect branches
      # - indirect calls
      # - indirect globals
      # - C-string encryption
      # - control-flow flattening
      # clang-cl-safe forwarding form. /clang:<arg> is passed to
      # the underlying Clang driver instead of being parsed as a cl.exe option.
      AKIRA_FLAGS: >-
        /clang:-mllvm /clang:-irobf-indbr
        /clang:-mllvm /clang:-irobf-icall
        /clang:-mllvm /clang:-irobf-indgv
        /clang:-mllvm /clang:-irobf-cse
        /clang:-mllvm /clang:-irobf-cff

    steps:
      # ============================================================
      # 1. HOST / DOWNLOAD TOOLS
      # ============================================================

      - name: Show runner tools
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== Python ==="
          python --version

          Write-Host "=== CMake ==="
          cmake --version

          Write-Host "=== Git ==="
          git --version

          Write-Host "=== Ninja ==="
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if ($null -eq $ninja) {
            throw 'Không tìm thấy ninja.exe trên runner.'
          }
          ninja --version

      - name: Install gdown
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install "gdown>=5.2,<6"

      # ============================================================
      # 2. VISUAL STUDIO / WINDOWS SDK ENVIRONMENT
      # ============================================================

      - name: Install pinned VS2022 Build Tools 17.8
        run: |
          $ErrorActionPreference = 'Stop'

          $bootstrapper = Join-Path `
            $env:RUNNER_TEMP `
            'vs_BuildTools_17_8.exe'

          Write-Host 'Downloading fixed Visual Studio 2022 Build Tools 17.8 bootstrapper...'

          Invoke-WebRequest `
            -Uri $env:VS178_BOOTSTRAPPER_URL `
            -OutFile $bootstrapper `
            -UseBasicParsing

          if (!(Test-Path -LiteralPath $bootstrapper)) {
            throw 'Không tải được VS2022 17.8 Build Tools bootstrapper.'
          }

          $size = (Get-Item -LiteralPath $bootstrapper).Length
          if ($size -lt 500000) {
            throw "Bootstrapper quá nhỏ/bất thường: $size bytes."
          }

          # Verify Authenticode trước khi chạy bootstrapper tải từ mạng.
          $sig = Get-AuthenticodeSignature -LiteralPath $bootstrapper

          if ($sig.Status -ne 'Valid') {
            throw "Bootstrapper Authenticode không hợp lệ: $($sig.Status)"
          }

          if (
            $null -eq $sig.SignerCertificate -or
            $sig.SignerCertificate.Subject -notmatch '(?i)Microsoft'
          ) {
            throw 'Bootstrapper không được ký bởi Microsoft.'
          }

          Write-Host "Bootstrapper signer: $($sig.SignerCertificate.Subject)"

          if (Test-Path -LiteralPath $env:VS178_INSTALL) {
            Remove-Item `
              -LiteralPath $env:VS178_INSTALL `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          # Cài instance Build Tools 17.8 riêng.
          # Chỉ cần VC x86/x64; Windows SDK đã có sẵn trên windows-2022.
          $args = @(
            '--quiet',
            '--wait',
            '--norestart',
            '--nocache',
            '--installPath', $env:VS178_INSTALL,
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          )

          $proc = Start-Process `
            -FilePath $bootstrapper `
            -ArgumentList $args `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
            throw "VS2022 Build Tools 17.8 install thất bại. Exit code: $($proc.ExitCode)"
          }

          $vcvars = Join-Path `
            $env:VS178_INSTALL `
            'VC\Auxiliary\Build\vcvars64.bat'

          if (!(Test-Path -LiteralPath $vcvars)) {
            throw "Cài xong nhưng không thấy vcvars64.bat: $vcvars"
          }

          "VCVARS64=$vcvars" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "VS2022 Build Tools 17.8 installed: $env:VS178_INSTALL"

      - name: Initialize VS2022 17.8 x64 environment
        run: |
          $ErrorActionPreference = 'Stop'

          $envFile = Join-Path `
            $env:RUNNER_TEMP `
            'vs178_env.txt'

          cmd.exe /d /s /c "`"$env:VCVARS64`" >nul && set" |
            Out-File `
              -LiteralPath $envFile `
              -Encoding ascii

          foreach ($line in Get-Content -LiteralPath $envFile) {
            if ($line -notmatch '=') {
              continue
            }

            $parts = $line -split '=', 2

            if ($parts.Count -ne 2) {
              continue
            }

            $name = $parts[0]
            $value = $parts[1]

            if ([string]::IsNullOrWhiteSpace($name)) {
              continue
            }

            "$name=$value" |
              Out-File `
                $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
          }

          Remove-Item `
            -LiteralPath $envFile `
            -Force

      - name: Verify VS2022 17.8 MSVC 14.38 environment
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "VCToolsVersion   : $env:VCToolsVersion"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host "WindowsSdkDir    : $env:WindowsSdkDir"
          Write-Host "WindowsSDKVersion: $env:WindowsSDKVersion"

          if ([string]::IsNullOrWhiteSpace($env:VCToolsVersion)) {
            throw 'VCToolsVersion rỗng.'
          }

          if (!$env:VCToolsVersion.StartsWith("$env:MSVC_TOOLSET_VERSION.")) {
            throw (
              "Sai MSVC toolset. Expected=$env:MSVC_TOOLSET_VERSION.x " +
              "Actual=$env:VCToolsVersion"
            )
          }

          if (
            [string]::IsNullOrWhiteSpace($env:VCToolsInstallDir) -or
            !(Test-Path -LiteralPath $env:VCToolsInstallDir)
          ) {
            throw "VCToolsInstallDir không hợp lệ: $env:VCToolsInstallDir"
          }

          $cl = Join-Path `
            $env:VCToolsInstallDir `
            'bin\Hostx64\x64\cl.exe'

          $link = Join-Path `
            $env:VCToolsInstallDir `
            'bin\Hostx64\x64\link.exe'

          $yvals = Join-Path `
            $env:VCToolsInstallDir `
            'include\yvals_core.h'

          foreach ($required in @($cl, $link, $yvals)) {
            if (!(Test-Path -LiteralPath $required)) {
              throw "MSVC 14.38 install thiếu: $required"
            }
          }

          Write-Host '=== cl.exe ==='
          & $cl 2>&1 | Select-Object -First 5

          Write-Host 'MSVC 14.38 environment: OK'

      # ============================================================
      # 3. RESTORE PINNED AKIRA COMPILER CACHE
      # ============================================================

      - name: Restore Akira LLVM17 compiler cache
        id: akira-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\AkiraLLVM17
          key: akira-llvm17-win2022-${{ env.AKIRA_COMMIT }}-${{ env.AKIRA_CACHE_VERSION }}

      # ============================================================
      # 4. BUILD AKIRA ON CACHE MISS
      #
      # Chỉ build target "clang".
      # clang-cl là driver alias của clang, KHÔNG phải Ninja target.
      # Không build lld: clang-cl dùng MSVC link.exe từ VS environment.
      # Điều này nhanh hơn và tránh lỗi "unknown target clang-cl/lld-link".
      # ============================================================

      - name: Clone pinned Akira source
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:GITHUB_WORKSPACE 'akira-src'

          if (Test-Path -LiteralPath $src) {
            Remove-Item -LiteralPath $src -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $src `
            -Force |
            Out-Null

          git -C $src init
          if ($LASTEXITCODE -ne 0) {
            throw 'git init Akira thất bại.'
          }

          git -C $src remote add origin $env:AKIRA_REPO
          if ($LASTEXITCODE -ne 0) {
            throw 'Không thêm được Akira remote.'
          }

          # Fetch đúng commit đã pin, depth=1 để tránh kéo lịch sử LLVM rất lớn.
          git -C $src fetch `
            --depth 1 `
            origin `
            $env:AKIRA_COMMIT

          if ($LASTEXITCODE -ne 0) {
            throw "Fetch Akira commit $env:AKIRA_COMMIT thất bại."
          }

          git -C $src checkout `
            --detach `
            FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Checkout Akira commit $env:AKIRA_COMMIT thất bại."
          }

          $actual = (git -C $src rev-parse HEAD).Trim()

          if ($actual -ne $env:AKIRA_COMMIT) {
            throw "Akira commit mismatch. Expected=$env:AKIRA_COMMIT Actual=$actual"
          }

          Write-Host "Akira pinned commit: $actual"

      - name: Verify Akira source before build
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:GITHUB_WORKSPACE 'akira-src'
          $crypto = Join-Path `
            $src `
            'llvm\lib\Transforms\Obfuscation\CryptoUtils.cpp'

          if (!(Test-Path -LiteralPath $crypto)) {
            throw 'Thiếu CryptoUtils.cpp trong Akira source.'
          }

          $text = Get-Content -LiteralPath $crypto -Raw

          # Commit pin hiện tại đã có <fstream>; giữ fallback để workflow
          # vẫn có thông báo rõ nếu source bị thay đổi ngoài ý muốn.
          if ($text -notmatch '#include\s*<fstream>') {
            throw 'Akira source thiếu #include <fstream>; không tự patch source đã pin.'
          }

          $requiredMarkers = @(
            'irobf-indbr',
            'irobf-icall',
            'irobf-indgv',
            'irobf-cse',
            'irobf-cff'
          )

          $llvmRoot = Join-Path $src 'llvm'
          $allObfText = Get-ChildItem `
            -LiteralPath (Join-Path $llvmRoot 'lib\Transforms\Obfuscation') `
            -File `
            -Recurse |
            ForEach-Object {
              Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue
            }

          $joined = $allObfText -join "`n"

          foreach ($marker in $requiredMarkers) {
            if ($joined -notmatch [regex]::Escape($marker)) {
              throw "Akira source không thấy marker pass: $marker"
            }
          }

          Write-Host 'Akira source gate: OK'

      - name: Configure Akira LLVM17
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:GITHUB_WORKSPACE 'akira-src'
          $build = Join-Path $env:GITHUB_WORKSPACE 'akira-build'

          if (Test-Path -LiteralPath $build) {
            Remove-Item -LiteralPath $build -Recurse -Force
          }

          cmake `
            -S (Join-Path $src 'llvm') `
            -B $build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="/utf-8" `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DLLVM_ENABLE_PROJECTS="clang" `
            -DLLVM_TARGETS_TO_BUILD="X86" `
            -DLLVM_ENABLE_DIA_SDK:BOOL=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_BUILD_TESTS=OFF `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF

          if ($LASTEXITCODE -ne 0) {
            throw "Configure Akira LLVM17 thất bại: $LASTEXITCODE"
          }

          $cache = Join-Path $build 'CMakeCache.txt'

          if (!(Test-Path -LiteralPath $cache)) {
            throw 'Akira CMakeCache.txt không tồn tại.'
          }

          # IMPORTANT:
          # Không kiểm tra CMakeCache bằng Get-Content -Raw + regex "$".
          # File CMakeCache trên Windows dùng CRLF; regex "...OFF$" sẽ thấy
          # ký tự \r trước \n và có thể báo FALSE dù giá trị thực là OFF.
          #
          # Đọc theo từng line để PowerShell tự bỏ CR/LF.
          $cacheLines = Get-Content -LiteralPath $cache

          $diaLine = $cacheLines |
            Where-Object {
              $_ -like 'LLVM_ENABLE_DIA_SDK:*'
            } |
            Select-Object -First 1

          if ($null -eq $diaLine) {
            throw 'CMakeCache không có LLVM_ENABLE_DIA_SDK.'
          }

          Write-Host "CMake cache DIA: $diaLine"

          if ($diaLine -ne 'LLVM_ENABLE_DIA_SDK:BOOL=OFF') {
            throw (
              "LLVM_ENABLE_DIA_SDK không phải BOOL=OFF. " +
              "Actual='$diaLine'"
            )
          }

          $compilerLine = $cacheLines |
            Where-Object {
              $_ -match '^CMAKE_CXX_COMPILER(?::[^=]+)?='
            } |
            Select-Object -First 1

          if ($null -eq $compilerLine) {
            throw 'Không đọc được CMAKE_CXX_COMPILER từ CMakeCache.'
          }

          $akiraHostCompiler = (
            $compilerLine -replace '^[^=]+=', ''
          ).Trim().Replace('/', '\')

          if (
            $akiraHostCompiler -notlike "$env:VS178_INSTALL\VC\Tools\MSVC\14.38.*\bin\Hostx64\x64\cl.exe"
          ) {
            throw (
              "Akira host compiler không phải MSVC 14.38 từ VS17.8. " +
              "Actual=$akiraHostCompiler"
            )
          }

          $ninjaFile = Join-Path $build 'build.ninja'

          if (!(Test-Path -LiteralPath $ninjaFile)) {
            throw 'Akira build.ninja không tồn tại.'
          }

          $diaLeak = Select-String `
            -LiteralPath $ninjaFile `
            -Pattern 'DIA SDK[\\/]include|DebugInfo[\\/]PDB[\\/]DIA[\\/].*\.cpp' `
            -ErrorAction SilentlyContinue

          if ($diaLeak) {
            throw (
              "DIA vẫn lọt vào build graph dù LLVM_ENABLE_DIA_SDK=OFF. " +
              "Ví dụ: $($diaLeak[0].Line)"
            )
          }

          Write-Host "Akira host compiler: $akiraHostCompiler"
          Write-Host 'LLVM DIA SDK: OFF'
          Write-Host 'DIA sources/include paths in build.ninja: NONE'

          Write-Host '=== Critical CMake cache values ==='
          $cacheLines |
            Where-Object {
              $_ -match '^(LLVM_ENABLE_DIA_SDK|CMAKE_CXX_COMPILER|LLVM_ENABLE_PROJECTS|LLVM_TARGETS_TO_BUILD):'
            } |
            ForEach-Object {
              Write-Host $_
            }

      - name: Preflight Akira critical LLVM targets
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $build = Join-Path $env:GITHUB_WORKSPACE 'akira-build'

          $jobs = [Math]::Min(
            [Environment]::ProcessorCount,
            4
          )

          if ($jobs -lt 1) {
            $jobs = 1
          }

          Write-Host "Preflight with $jobs jobs..."

          cmake `
            --build $build `
            --target LLVMDebugInfoPDB LLVMObfuscation `
            --parallel $jobs

          if ($LASTEXITCODE -ne 0) {
            throw (
              "Akira critical-target preflight thất bại: $LASTEXITCODE. " +
              "DIA đã được xác nhận OFF trước bước này; xem dòng FAILED đầu tiên " +
              "để biết dependency thật sự còn thiếu. Dừng trước full clang."
            )
          }

          Write-Host 'LLVMDebugInfoPDB preflight: OK'
          Write-Host 'LLVMObfuscation preflight: OK'

      - name: Build Akira LLVM17 clang
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $build = Join-Path $env:GITHUB_WORKSPACE 'akira-build'

          # clang-cl KHÔNG phải Ninja target riêng.
          # Tự lấy số CPU runner nhưng cap ở 4 để không làm runner Windows
          # thiếu RAM khi compile LLVM.
          $jobs = [Math]::Min(
            [Environment]::ProcessorCount,
            4
          )

          if ($jobs -lt 1) {
            $jobs = 1
          }

          Write-Host "Building Akira clang with $jobs parallel jobs..."

          cmake `
            --build $build `
            --target clang `
            --parallel $jobs

          if ($LASTEXITCODE -ne 0) {
            throw "Build Akira LLVM17 clang thất bại: $LASTEXITCODE"
          }

          $clang = Join-Path $build 'bin\clang.exe'

          if (!(Test-Path -LiteralPath $clang)) {
            throw 'Build xong nhưng thiếu clang.exe.'
          }

          Write-Host 'Akira clang build: OK'

      - name: Install Akira compiler
        if: steps.akira-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'

          $build = Join-Path $env:GITHUB_WORKSPACE 'akira-build'
          $buildBin = Join-Path $build 'bin'

          $dest = $env:AKIRA_INSTALL
          $destBin = Join-Path $dest 'bin'

          if (Test-Path -LiteralPath $dest) {
            Remove-Item -LiteralPath $dest -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $destBin `
            -Force |
            Out-Null

          $clang = Join-Path $buildBin 'clang.exe'

          if (!(Test-Path -LiteralPath $clang)) {
            throw 'Akira build thiếu clang.exe.'
          }

          Copy-Item `
            -LiteralPath $clang `
            -Destination (Join-Path $destBin 'clang.exe') `
            -Force

          # CMake/LLVM có thể tạo alias clang-cl trong build/bin.
          # Nếu alias không có, copy clang.exe với tên clang-cl.exe.
          # Clang chọn CL-compatible driver mode dựa trên executable name.
          $builtClangCl = Join-Path $buildBin 'clang-cl.exe'
          $destClangCl = Join-Path $destBin 'clang-cl.exe'

          if (Test-Path -LiteralPath $builtClangCl) {
            Copy-Item `
              -LiteralPath $builtClangCl `
              -Destination $destClangCl `
              -Force
          }
          else {
            Copy-Item `
              -LiteralPath $clang `
              -Destination $destClangCl `
              -Force
          }

          # Giữ clang++ để debug/tooling nếu cần.
          $builtClangXX = Join-Path $buildBin 'clang++.exe'
          $destClangXX = Join-Path $destBin 'clang++.exe'

          if (Test-Path -LiteralPath $builtClangXX) {
            Copy-Item `
              -LiteralPath $builtClangXX `
              -Destination $destClangXX `
              -Force
          }
          else {
            Copy-Item `
              -LiteralPath $clang `
              -Destination $destClangXX `
              -Force
          }

          # Copy DLL compiler dependencies nếu build tạo DLL.
          Get-ChildItem `
            -LiteralPath $buildBin `
            -Filter '*.dll' `
            -File `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item `
                -LiteralPath $_.FullName `
                -Destination $destBin `
                -Force
            }

          # Clang builtin headers: stddef.h, stdarg.h, intrin.h, immintrin.h...
          $resourceSrc = Join-Path $build 'lib\clang'
          $resourceParent = Join-Path $dest 'lib'

          if (!(Test-Path -LiteralPath $resourceSrc)) {
            throw "Không tìm thấy Clang resource headers: $resourceSrc"
          }

          New-Item `
            -ItemType Directory `
            -Path $resourceParent `
            -Force |
            Out-Null

          Copy-Item `
            -LiteralPath $resourceSrc `
            -Destination $resourceParent `
            -Recurse `
            -Force

          $env:AKIRA_COMMIT |
            Out-File `
              (Join-Path $dest 'AKIRA_COMMIT.txt') `
              -Encoding ascii

          foreach ($required in @(
            'clang.exe',
            'clang-cl.exe',
            'clang++.exe'
          )) {
            $path = Join-Path $destBin $required
            if (!(Test-Path -LiteralPath $path)) {
              throw "Akira install thiếu $required"
            }
          }

          Write-Host 'Akira compiler installed:'
          Get-ChildItem -LiteralPath $destBin -File |
            Select-Object Name, Length |
            Format-Table

      # Save NGAY sau khi build compiler thành công.
      # Như vậy nếu project/pass test phía sau lỗi, lần chạy kế tiếp
      # vẫn không phải build lại LLVM hơn 1 giờ.
      - name: Save Akira LLVM17 compiler cache immediately
        if: steps.akira-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\AkiraLLVM17
          key: akira-llvm17-win2022-${{ env.AKIRA_COMMIT }}-${{ env.AKIRA_CACHE_VERSION }}

      # ============================================================
      # 5. VERIFY CACHED/BUILT AKIRA
      # ============================================================

      - name: Verify Akira compiler
        run: |
          $ErrorActionPreference = 'Stop'

          $clang = Join-Path $env:AKIRA_INSTALL 'bin\clang.exe'
          $clangcl = Join-Path $env:AKIRA_INSTALL 'bin\clang-cl.exe'
          $commitFile = Join-Path $env:AKIRA_INSTALL 'AKIRA_COMMIT.txt'

          foreach ($tool in @($clang, $clangcl, $commitFile)) {
            if (!(Test-Path -LiteralPath $tool)) {
              throw "Akira cache/install thiếu: $tool"
            }
          }

          $cachedCommit = (Get-Content -LiteralPath $commitFile -Raw).Trim()

          if ($cachedCommit -ne $env:AKIRA_COMMIT) {
            throw "Akira cache commit mismatch. Expected=$env:AKIRA_COMMIT Cached=$cachedCommit"
          }

          Write-Host '=== Akira clang ==='
          & $clang --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Akira clang.exe không chạy được.'
          }

          Write-Host '=== Akira clang-cl ==='
          & $clangcl --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Akira clang-cl.exe không chạy được.'
          }

          Write-Host '=== MSVC compatibility toolset ==='
          Write-Host "VCToolsVersion: $env:VCToolsVersion"
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"

          if (!$env:VCToolsVersion.StartsWith("$env:MSVC_TOOLSET_VERSION.")) {
            throw (
              "Akira Clang 17 đang bị ghép với sai MSVC STL. " +
              "Expected=$env:MSVC_TOOLSET_VERSION.x Actual=$env:VCToolsVersion"
            )
          }

          "AKIRA_CLANG=$clang" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "AKIRA_CLANGCL=$clangcl" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify clang-cl forwarding syntax
        run: |
          $ErrorActionPreference = 'Stop'

          $dir = Join-Path $env:RUNNER_TEMP 'clangcl-forwarding-test'

          if (Test-Path -LiteralPath $dir) {
            Remove-Item -LiteralPath $dir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          $srcFile = Join-Path $dir 'driver_probe.cpp'

          @'
          #include <cstdint>

          static_assert(_MSC_VER == 1938, "Expected MSVC compatibility 19.38");

          int main()
          {
              return 0;
          }
          '@ |
            Out-File `
              -LiteralPath $srcFile `
              -Encoding ascii

          Push-Location $dir

          try {
            & $env:AKIRA_CLANGCL `
              /nologo `
              /c `
              /Fodriver_probe.obj `
              $srcFile `
              /clang:-fms-compatibility-version=19.38

            if ($LASTEXITCODE -ne 0) {
              throw (
                "clang-cl /clang: forwarding test thất bại: " +
                "$LASTEXITCODE"
              )
            }

            if (!(Test-Path -LiteralPath 'driver_probe.obj')) {
              Write-Host 'Files created by clang-cl:'
              Get-ChildItem -LiteralPath . -Force |
                Select-Object Name, Length |
                Format-Table

              throw 'clang-cl forwarding test không tạo driver_probe.obj.'
            }

            $objSize = (Get-Item -LiteralPath 'driver_probe.obj').Length

            if ($objSize -le 0) {
              throw 'driver_probe.obj được tạo nhưng rỗng.'
            }

            Write-Host "driver_probe.obj: $objSize bytes"
            Write-Host 'clang-cl /clang:-fms-compatibility-version=19.38: OK'
          }
          finally {
            Pop-Location
          }

      - name: Verify Akira obfuscation passes by compile and run
        run: |
          $ErrorActionPreference = 'Stop'

          $testDir = Join-Path $env:RUNNER_TEMP 'akira-pass-test'

          if (Test-Path -LiteralPath $testDir) {
            Remove-Item -LiteralPath $testDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $testDir `
            -Force |
            Out-Null

          $testCpp = Join-Path $testDir 'test.cpp'

          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <cstdint>
          #include <string>

          volatile std::int32_t g_value = 123;
          volatile std::int32_t g_sink = 0;

          __declspec(noinline)
          std::int32_t test_function(std::int32_t x)
          {
              const char* text = "AKIRA_PASS_RUNTIME_TEST";
              std::string s = "MSVC_STL_OK";

              if (x > 50)
                  return g_value + static_cast<unsigned char>(text[0]);

              if ((x & 1) != 0)
                  return x * 5;

              if (GetCurrentProcessId() == 0 || s.empty())
                  return 9;

              return x * 7;
          }

          int main()
          {
              g_sink = test_function(42);
              return (g_sink == 294) ? 0 : 7;
          }
          '@ |
            Out-File `
              -LiteralPath $testCpp `
              -Encoding ascii

          Push-Location $testDir

          try {
            Write-Host 'Using clang-cl-safe /clang: forwarding for MSVC compatibility and Akira passes.'

            & $env:AKIRA_CLANGCL `
              /nologo `
              /O2 `
              /EHsc `
              /Feakira_test.exe `
              $testCpp `
              /clang:-fms-compatibility-version=19.38 `
              /clang:-mllvm /clang:-irobf-indbr `
              /clang:-mllvm /clang:-irobf-icall `
              /clang:-mllvm /clang:-irobf-indgv `
              /clang:-mllvm /clang:-irobf-cse `
              /clang:-mllvm /clang:-irobf-cff

            if ($LASTEXITCODE -ne 0) {
              throw "Akira pass compile test thất bại: $LASTEXITCODE"
            }

            if (!(Test-Path -LiteralPath 'akira_test.exe')) {
              Write-Host 'Files created by Akira pass compile:'
              Get-ChildItem -LiteralPath . -Force |
                Select-Object Name, Length |
                Format-Table

              throw 'Không tạo được akira_test.exe.'
            }

            $akiraTestSize = (Get-Item -LiteralPath 'akira_test.exe').Length

            if ($akiraTestSize -le 1024) {
              throw "akira_test.exe bất thường: $akiraTestSize bytes."
            }

            Write-Host "akira_test.exe: $akiraTestSize bytes"

            & .\akira_test.exe

            if ($LASTEXITCODE -ne 0) {
              throw "Akira pass runtime test thất bại: $LASTEXITCODE"
            }

            Write-Host 'Akira all-pass compile + runtime test: OK'
          }
          finally {
            Pop-Location
          }

      # ============================================================
      # 6. DOWNLOAD SOURCE FROM GOOGLE DRIVE
      # ============================================================

      - name: Download source ZIP from Google Drive
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          $ErrorActionPreference = 'Stop'

          $driveInput = $env:DRIVE_URL.Trim()

          if ([string]::IsNullOrWhiteSpace($driveInput)) {
            throw 'drive_url rỗng.'
          }

          if ($driveInput -match '^[A-Za-z0-9_-]{20,}$') {
            $fileId = $driveInput
          }
          elseif ($driveInput -match '/d/([A-Za-z0-9_-]+)') {
            $fileId = $Matches[1]
          }
          elseif ($driveInput -match '[?&]id=([A-Za-z0-9_-]+)') {
            $fileId = $Matches[1]
          }
          else {
            throw 'Không lấy được Google Drive file ID.'
          }

          python -c "import gdown,sys,os; p=gdown.download(id=sys.argv[1], output='source.zip', quiet=False); raise SystemExit(0 if p and os.path.isfile(p) and os.path.getsize(p)>1024 else 1)" "$fileId"

          if ($LASTEXITCODE -ne 0) {
            throw "gdown thất bại: $LASTEXITCODE"
          }

          if (!(Test-Path -LiteralPath 'source.zip')) {
            throw 'Không tải được source.zip.'
          }

          $zipSize = (Get-Item -LiteralPath 'source.zip').Length

          if ($zipSize -le 1024) {
            throw "source.zip quá nhỏ: $zipSize bytes."
          }

          $sourceHash = Get-FileHash `
            -LiteralPath 'source.zip' `
            -Algorithm SHA256

          "SOURCE_ZIP_SHA256=$($sourceHash.Hash)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Source ZIP size: $zipSize"
          Write-Host "Source ZIP SHA256: $($sourceHash.Hash)"

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          try {
            $archive = [System.IO.Compression.ZipFile]::OpenRead(
              (Resolve-Path 'source.zip')
            )

            $entryCount = $archive.Entries.Count
            $archive.Dispose()

            if ($entryCount -le 0) {
              throw 'ZIP không có file.'
            }

            Write-Host "ZIP entries: $entryCount"
          }
          catch {
            throw "source.zip không hợp lệ: $($_.Exception.Message)"
          }

          if (Test-Path -LiteralPath 'source') {
            Remove-Item -LiteralPath 'source' -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path 'source' `
            -Force |
            Out-Null

          Expand-Archive `
            -LiteralPath 'source.zip' `
            -DestinationPath 'source' `
            -Force

      # ============================================================
      # 7. LOCATE PROJECT + HARDENING SOURCE GATE
      # ============================================================

      - name: Locate SpecialReloadClient CMake project
        run: |
          $ErrorActionPreference = 'Stop'

          $cmakeFile = Get-ChildItem `
            -LiteralPath 'source' `
            -Filter 'CMakeLists.txt' `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](build|\.git|out|cmake-build-[^\\/]+)[\\/]' -and
              (
                Test-Path -LiteralPath (
                  Join-Path $_.Directory.FullName 'SpecialReloadClient.cpp'
                )
              )
            } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1

          if ($null -eq $cmakeFile) {
            throw 'Không tìm thấy CMakeLists.txt cạnh SpecialReloadClient.cpp.'
          }

          $project = $cmakeFile.Directory.FullName

          "PROJECT_DIR=$project" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Project: $project"

          Get-ChildItem -LiteralPath $project |
            Format-Table Name, Length, LastWriteTime

      - name: Verify hardened source
        run: |
          $ErrorActionPreference = 'Stop'

          Set-Location -LiteralPath $env:PROJECT_DIR

          foreach ($required in @(
            'SpecialReloadClient.cpp',
            'StringObf.h',
            'AntiDebug.h'
          )) {
            if (!(Test-Path -LiteralPath $required)) {
              throw "Thiếu $required — source ZIP không phải hardened source."
            }
          }

          $cpp = Get-Content `
            -LiteralPath 'SpecialReloadClient.cpp' `
            -Raw

          foreach ($needle in @(
            'StringObf.h',
            'AntiDebug.h',
            'OBF("/api/specialreload/register")'
          )) {
            if (!$cpp.Contains($needle)) {
              throw "Hardening source gate thiếu: $needle"
            }
          }

          Write-Host 'Hardening source gate: OK'

      # ============================================================
      # 7B. NORMALIZE / VALIDATE PROJECT CMAKE SOURCES
      #
      # Some source ZIP revisions carry a stale reference to
      # SpecialReloadNative.cpp even though the actual entry point is
      # SpecialReloadClient.cpp. Remove ONLY that known stale token when
      # the file is absent, then validate every literal .cpp reference.
      # ============================================================

      - name: Normalize and validate CMake source list
        run: |
          $ErrorActionPreference = 'Stop'

          Set-Location -LiteralPath $env:PROJECT_DIR

          $cmake = Join-Path $env:PROJECT_DIR 'CMakeLists.txt'
          $mainName = 'SpecialReloadClient.cpp'
          $legacyName = 'SpecialReloadNative.cpp'
          $mainCpp = Join-Path $env:PROJECT_DIR $mainName
          $legacyCpp = Join-Path $env:PROJECT_DIR $legacyName

          if (!(Test-Path -LiteralPath $cmake)) {
            throw "Thiếu CMakeLists.txt: $cmake"
          }

          if (!(Test-Path -LiteralPath $mainCpp)) {
            throw "Thiếu ${mainName}: $mainCpp"
          }

          $cmakeText = Get-Content -LiteralPath $cmake -Raw

          # The current ZIP has SpecialReloadClient.cpp next to CMakeLists.txt,
          # while an older CMakeLists revision may still name
          # SpecialReloadNative.cpp. Repair that exact stale filename only.
          if (
            $cmakeText.Contains($legacyName) -and
            !(Test-Path -LiteralPath $legacyCpp)
          ) {
            $backup = Join-Path `
              $env:PROJECT_DIR `
              'CMakeLists.txt.workflow-backup'

            Copy-Item -LiteralPath $cmake -Destination $backup -Force

            # First check whether the allegedly missing file actually exists
            # elsewhere in the extracted ZIP. If exactly one copy exists, point
            # CMake at its real relative path rather than deleting source code.
            $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'
            $legacyMatches = @(
              Get-ChildItem `
                -LiteralPath $sourceRoot `
                -Filter $legacyName `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue
            )

            if ($legacyMatches.Count -eq 1) {
              $relative = [IO.Path]::GetRelativePath(
                $env:PROJECT_DIR,
                $legacyMatches[0].FullName
              ).Replace('\\', '/')

              $cmakeText = $cmakeText.Replace(
                $legacyName,
                $relative
              )

              Write-Host (
                "Repointed stale $legacyName reference to existing file: " +
                $relative
              )
            }
            elseif ($legacyMatches.Count -gt 1) {
              throw (
                "Tìm thấy nhiều $legacyName trong ZIP; không tự chọn: " +
                (($legacyMatches.FullName) -join ', ')
              )
            }
            else {
              # If the new filename is already listed, just remove the stale
              # old token. Otherwise this is a straight file rename mismatch:
              # replace old source name with the real new source name.
              if ($cmakeText.Contains($mainName)) {
                $cmakeText = $cmakeText.Replace($legacyName, '')
                Write-Host "Removed duplicate stale source token: $legacyName"
              }
              else {
                $cmakeText = $cmakeText.Replace($legacyName, $mainName)
                Write-Host "Replaced stale source name: $legacyName -> $mainName"
              }
            }

            Set-Content `
              -LiteralPath $cmake `
              -Value $cmakeText `
              -Encoding utf8

            Write-Host "CMake backup: $backup"
          }

          $cmakeText = Get-Content -LiteralPath $cmake -Raw

          # Collect literal .cpp paths from CMakeLists. Generator expressions
          # and ${variables} are intentionally ignored here and left to CMake.
          $matches = [regex]::Matches(
            $cmakeText,
            '(?im)(?<![$<A-Za-z0-9_])([A-Za-z0-9_.\\/\-]+\.cpp)(?![A-Za-z0-9_])'
          )

          $cppRefs = @(
            $matches |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object -Unique
          )

          if ($cppRefs.Count -eq 0) {
            throw 'CMakeLists.txt không có source .cpp literal nào.'
          }

          Write-Host '=== Effective CMake .cpp references ==='
          $cppRefs | ForEach-Object { Write-Host "  $_" }

          $missing = @()

          foreach ($ref in $cppRefs) {
            $normalized = $ref.Replace(
              '/',
              [IO.Path]::DirectorySeparatorChar
            )
            $candidate = Join-Path $env:PROJECT_DIR $normalized

            if (!(Test-Path -LiteralPath $candidate)) {
              $missing += $ref
            }
          }

          if ($missing.Count -gt 0) {
            Write-Host '=== Project files present ==='
            Get-ChildItem `
              -LiteralPath $env:PROJECT_DIR `
              -File `
              -Recurse |
              ForEach-Object {
                [IO.Path]::GetRelativePath(
                  $env:PROJECT_DIR,
                  $_.FullName
                )
              } |
              Sort-Object |
              Select-Object -First 200 |
              ForEach-Object { Write-Host "  $_" }

            throw (
              'CMakeLists.txt còn tham chiếu source không tồn tại: ' +
              ($missing -join ', ')
            )
          }

          if (!$cmakeText.Contains($mainName)) {
            throw "CMakeLists.txt không reference $mainName sau normalize."
          }

          Write-Host '=== Effective CMakeLists.txt ==='
          Get-Content -LiteralPath $cmake |
            ForEach-Object { Write-Host $_ }

          Write-Host 'CMake source-list validation: OK'

      # ============================================================
      # 8. CONFIGURE PROJECT WITH PINNED AKIRA clang-cl
      #
      # Dùng Ninja single-config để CMake không tự quay lại cl.exe.
      # Compiler probes chỉ nhận /clang:-fms-compatibility-version=19.38.
      # Akira passes được inject sau compiler detection.
      # ============================================================

      - name: Resolve and validate quoted local headers
        run: |
          $ErrorActionPreference = 'Stop'

          $project = $env:PROJECT_DIR
          $sourceRoot = Join-Path $env:GITHUB_WORKSPACE 'source'

          if (!(Test-Path -LiteralPath $project)) {
            throw "PROJECT_DIR không tồn tại: $project"
          }

          if (!(Test-Path -LiteralPath $sourceRoot)) {
            throw "Source root không tồn tại: $sourceRoot"
          }

          $codeExts = @(
            '.c', '.cc', '.cpp', '.cxx',
            '.h', '.hh', '.hpp', '.hxx', '.inl'
          )

          $codeFiles = @(
            Get-ChildItem `
              -LiteralPath $project `
              -File `
              -Recurse |
            Where-Object {
              $codeExts -contains $_.Extension.ToLowerInvariant()
            }
          )

          if ($codeFiles.Count -eq 0) {
            throw 'Không tìm thấy C/C++ source/header trong PROJECT_DIR.'
          }

          $allHeaders = @(
            Get-ChildItem `
              -LiteralPath $sourceRoot `
              -File `
              -Recurse |
            Where-Object {
              @('.h', '.hh', '.hpp', '.hxx', '.inl') -contains
                $_.Extension.ToLowerInvariant()
            }
          )

          $extraIncludeDirs = New-Object System.Collections.Generic.List[string]
          $missing = New-Object System.Collections.Generic.List[string]
          $ambiguous = New-Object System.Collections.Generic.List[string]

          foreach ($file in $codeFiles) {
            $fileText = Get-Content `
              -LiteralPath $file.FullName `
              -Raw `
              -ErrorAction Stop

            $includes = [regex]::Matches(
              $fileText,
              '(?m)^\s*#\s*include\s*"([^"]+)"'
            )

            foreach ($match in $includes) {
              $includeText = $match.Groups[1].Value.Trim()

              if ([string]::IsNullOrWhiteSpace($includeText)) {
                continue
              }

              # 1) Standard quoted-include behavior: relative to including file.
              $relativeToFile = Join-Path `
                $file.Directory.FullName `
                ($includeText.Replace(
                  '/',
                  [IO.Path]::DirectorySeparatorChar
                ))

              if (Test-Path -LiteralPath $relativeToFile) {
                continue
              }

              # 2) Also accept an include rooted at PROJECT_DIR.
              $relativeToProject = Join-Path `
                $project `
                ($includeText.Replace(
                  '/',
                  [IO.Path]::DirectorySeparatorChar
                ))

              if (Test-Path -LiteralPath $relativeToProject) {
                continue
              }

              $includeUnix = $includeText.Replace('\', '/')
              $leaf = [IO.Path]::GetFileName($includeText)

              # Prefer a unique exact suffix match, e.g.
              # include "net/NativeHttp.h" -> .../include/net/NativeHttp.h
              $suffixMatches = @(
                $allHeaders |
                Where-Object {
                  $rel = [IO.Path]::GetRelativePath(
                    $sourceRoot,
                    $_.FullName
                  ).Replace('\', '/')

                  $rel.EndsWith(
                    $includeUnix,
                    [System.StringComparison]::OrdinalIgnoreCase
                  )
                }
              )

              $chosen = $null

              if ($suffixMatches.Count -eq 1) {
                $chosen = $suffixMatches[0]
              }
              elseif ($suffixMatches.Count -gt 1) {
                $ambiguous.Add(
                  (
                    "{0} <- {1}: {2}" -f
                    $includeText,
                    [IO.Path]::GetRelativePath($project, $file.FullName),
                    (($suffixMatches.FullName) -join ' | ')
                  )
                )
                continue
              }
              else {
                # Fall back to basename only when it is globally unique.
                $basenameMatches = @(
                  $allHeaders |
                  Where-Object {
                    $_.Name.Equals(
                      $leaf,
                      [System.StringComparison]::OrdinalIgnoreCase
                    )
                  }
                )

                if ($basenameMatches.Count -eq 1) {
                  $chosen = $basenameMatches[0]
                }
                elseif ($basenameMatches.Count -gt 1) {
                  $ambiguous.Add(
                    (
                      "{0} <- {1}: {2}" -f
                      $includeText,
                      [IO.Path]::GetRelativePath($project, $file.FullName),
                      (($basenameMatches.FullName) -join ' | ')
                    )
                  )
                  continue
                }
              }

              if ($null -eq $chosen) {
                $missing.Add(
                  (
                    "{0} <- {1}" -f
                    $includeText,
                    [IO.Path]::GetRelativePath($project, $file.FullName)
                  )
                )
                continue
              }

              # Derive the include root that makes the original quoted include
              # resolve without rewriting user source.
              $includeNative = $includeText.Replace(
                '/',
                [IO.Path]::DirectorySeparatorChar
              )

              $chosenFull = $chosen.FullName

              if (
                $chosenFull.EndsWith(
                  $includeNative,
                  [System.StringComparison]::OrdinalIgnoreCase
                )
              ) {
                $includeRoot = $chosenFull.Substring(
                  0,
                  $chosenFull.Length - $includeNative.Length
                ).TrimEnd('\')
              }
              else {
                # Basename-only unique match.
                $includeRoot = $chosen.Directory.FullName
              }

              if ([string]::IsNullOrWhiteSpace($includeRoot)) {
                $includeRoot = $chosen.Directory.FullName
              }

              if (!$extraIncludeDirs.Contains($includeRoot)) {
                $extraIncludeDirs.Add($includeRoot)
              }

              Write-Host (
                "Resolved local include '{0}' from '{1}' via include dir '{2}'" -f
                $includeText,
                [IO.Path]::GetRelativePath($project, $file.FullName),
                $includeRoot
              )
            }
          }

          if ($ambiguous.Count -gt 0) {
            Write-Host '=== Ambiguous local includes ==='
            $ambiguous |
              Sort-Object -Unique |
              ForEach-Object {
                Write-Host ("  {0}" -f $_)
              }

            throw (
              'Có local header trùng tên ở nhiều vị trí; workflow không tự đoán.'
            )
          }

          if ($missing.Count -gt 0) {
            Write-Host '=== Missing local headers ==='
            $missing |
              Sort-Object -Unique |
              ForEach-Object {
                Write-Host ("  {0}" -f $_)
              }

            Write-Host '=== Header files actually present in extracted source ==='
            $allHeaders |
              ForEach-Object {
                [IO.Path]::GetRelativePath(
                  $sourceRoot,
                  $_.FullName
                )
              } |
              Sort-Object |
              Select-Object -First 300 |
              ForEach-Object {
                Write-Host ("  {0}" -f $_)
              }

            throw (
              'Source ZIP thiếu local header bắt buộc. ' +
              'Không tạo header giả vì sẽ có nguy cơ sai declaration/ABI.'
            )
          }

          $resolvedDirs = @(
            $extraIncludeDirs |
              Sort-Object -Unique
          )

          if ($resolvedDirs.Count -gt 0) {
            $joined = $resolvedDirs -join ';'

            "SPECIALRELOAD_EXTRA_INCLUDE_DIRS=$joined" |
              Out-File `
                $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            Write-Host '=== Extra include directories resolved ==='
            $resolvedDirs |
              ForEach-Object {
                Write-Host ("  {0}" -f $_)
              }
          }
          else {
            "SPECIALRELOAD_EXTRA_INCLUDE_DIRS=" |
              Out-File `
                $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

            Write-Host 'All quoted local includes already resolve normally.'
          }

          Write-Host 'Quoted local-header validation: OK'

      - name: Sanitize MSVC-only flags for clang-cl
        run: |
          $ErrorActionPreference = 'Stop'

          # The project was written with an MSVC branch. clang-cl intentionally
          # defines MSVC-compatible CMake variables, so MSVC-only switches can
          # accidentally be added even though Clang does not implement them.
          #
          # Keep /WX. Remove only switches proven invalid/unused in this build:
          #   /Zc:preprocessor  -> Clang already uses its own preprocessor
          #   /GL               -> MSVC whole-program optimization
          #   /LTCG[:...]       -> MSVC linker-side LTCG counterpart
          #
          # Akira obfuscation remains enabled independently.

          $project = $env:PROJECT_DIR

          $cmakeFiles = @(
            Get-ChildItem `
              -LiteralPath $project `
              -File `
              -Recurse |
            Where-Object {
              (
                $_.Name -eq 'CMakeLists.txt' -or
                $_.Extension -ieq '.cmake'
              ) -and
              $_.Name -notlike '*.workflow-*'
            }
          )

          if ($cmakeFiles.Count -eq 0) {
            throw 'Không tìm thấy CMakeLists.txt/.cmake để sanitize.'
          }

          $changed = @()

          foreach ($file in $cmakeFiles) {
            $original = Get-Content -LiteralPath $file.FullName -Raw
            $updated = $original

            # Case-insensitive, token-aware removal.
            $updated = [regex]::Replace(
              $updated,
              '(?i)(?<![A-Za-z0-9_])/Zc:preprocessor(?![A-Za-z0-9_])',
              ''
            )

            $updated = [regex]::Replace(
              $updated,
              '(?i)(?<![A-Za-z0-9_])/GL(?![A-Za-z0-9_:])',
              ''
            )

            $updated = [regex]::Replace(
              $updated,
              '(?i)(?<![A-Za-z0-9_])/LTCG(?::[A-Za-z0-9_-]+)?(?![A-Za-z0-9_])',
              ''
            )

            if ($updated -ne $original) {
              $relative = [IO.Path]::GetRelativePath(
                $project,
                $file.FullName
              )

              $backupRoot = Join-Path `
                $env:RUNNER_TEMP `
                'cmake-msvc-flag-backup'

              $backup = Join-Path $backupRoot $relative
              $backupDir = Split-Path -Parent $backup

              New-Item `
                -ItemType Directory `
                -Path $backupDir `
                -Force |
                Out-Null

              Copy-Item `
                -LiteralPath $file.FullName `
                -Destination $backup `
                -Force

              Set-Content `
                -LiteralPath $file.FullName `
                -Value $updated `
                -Encoding utf8

              $changed += $relative
            }
          }

          Write-Host '=== CMake files sanitized for clang-cl ==='

          if ($changed.Count -eq 0) {
            Write-Host 'No literal MSVC-only flags required patching.'
          }
          else {
            $changed |
              Sort-Object -Unique |
              ForEach-Object {
                Write-Host ("  {0}" -f $_)
              }
          }

          # Fail here if any active CMake input still contains the known
          # incompatible switches. This avoids waiting for compilation.
          $remaining = @()

          foreach ($file in $cmakeFiles) {
            $current = Get-Content -LiteralPath $file.FullName -Raw

            if (
              $current -match '(?i)/Zc:preprocessor' -or
              $current -match '(?i)(?<![A-Za-z0-9_])/GL(?![A-Za-z0-9_:])' -or
              $current -match '(?i)/LTCG(?::[A-Za-z0-9_-]+)?'
            ) {
              $remaining += $file.FullName
            }
          }

          if ($remaining.Count -gt 0) {
            throw (
              'Vẫn còn MSVC-only flags trong CMake input: ' +
              (($remaining | Sort-Object -Unique) -join ', ')
            )
          }

          Write-Host 'MSVC-only clang-cl flag sanitation: OK'

      # ============================================================
      # 8A. CMAKE/CLANG-CL ABI PREFLIGHT — NO OBFUSCATION
      # ============================================================

      - name: Preflight CMake clang-cl ABI without obfuscation
        run: |
          $ErrorActionPreference = 'Stop'

          $freshEnv = cmd.exe /d /s /c "`"$env:VCVARS64`" >nul 2>&1 && set"

          foreach ($line in $freshEnv) {
            if ($line -match '^([^=]+)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable(
                $Matches[1], $Matches[2]
              )
            }
          }

          if (
            [string]::IsNullOrWhiteSpace($env:VCToolsVersion) -or
            !$env:VCToolsVersion.StartsWith("$env:MSVC_TOOLSET_VERSION.")
          ) {
            throw (
              "MSVC 14.38 environment không đúng trước CMake probe. " +
              "Actual=$env:VCToolsVersion"
            )
          }

          $probe = Join-Path $env:RUNNER_TEMP 'cmake-clangcl-probe'

          if (Test-Path -LiteralPath $probe) {
            Remove-Item -LiteralPath $probe -Recurse -Force
          }

          New-Item -ItemType Directory -Path $probe -Force | Out-Null

          @'
          cmake_minimum_required(VERSION 3.20)
          project(ClangClAbiProbe LANGUAGES C CXX)

          message(STATUS "PROBE_C_ID=${CMAKE_C_COMPILER_ID}")
          message(STATUS "PROBE_CXX_ID=${CMAKE_CXX_COMPILER_ID}")
          message(STATUS "PROBE_C_SIMULATE_ID=${CMAKE_C_SIMULATE_ID}")
          message(STATUS "PROBE_CXX_SIMULATE_ID=${CMAKE_CXX_SIMULATE_ID}")
          message(STATUS "PROBE_C_SIMULATE_VERSION=${CMAKE_C_SIMULATE_VERSION}")
          message(STATUS "PROBE_CXX_SIMULATE_VERSION=${CMAKE_CXX_SIMULATE_VERSION}")
          message(STATUS "PROBE_MSVC_VERSION=${MSVC_VERSION}")
          message(STATUS "PROBE_CXX_FRONTEND=${CMAKE_CXX_COMPILER_FRONTEND_VARIANT}")

          if(NOT CMAKE_CXX_COMPILER_ID STREQUAL "Clang")
            message(FATAL_ERROR "Expected Clang CXX compiler.")
          endif()

          if(NOT CMAKE_CXX_SIMULATE_ID STREQUAL "MSVC")
            message(FATAL_ERROR "clang-cl is not simulating MSVC ABI.")
          endif()

          if(NOT CMAKE_CXX_COMPILER_FRONTEND_VARIANT STREQUAL "MSVC")
            message(FATAL_ERROR "clang-cl frontend is not MSVC-like.")
          endif()

          if(NOT MSVC_VERSION EQUAL 1938)
            message(FATAL_ERROR "Expected MSVC_VERSION=1938, actual=${MSVC_VERSION}")
          endif()

          add_executable(clangcl_probe main.cpp)
          '@ |
            Out-File `
              -LiteralPath (Join-Path $probe 'CMakeLists.txt') `
              -Encoding utf8

          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <string>

          static_assert(_MSC_VER == 1938, "Expected _MSC_VER 1938");

          int main()
          {
              std::string s = "clang-cl-msvc-abi-ok";
              return (GetCurrentProcessId() != 0 && !s.empty()) ? 0 : 7;
          }
          '@ |
            Out-File `
              -LiteralPath (Join-Path $probe 'main.cpp') `
              -Encoding utf8

          $probeBuild = Join-Path $probe 'build'

          cmake `
            -S $probe `
            -B $probeBuild `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$env:AKIRA_CLANGCL" `
            "-DCMAKE_CXX_COMPILER=$env:AKIRA_CLANGCL" `
            "-DCMAKE_C_FLAGS=/clang:-fms-compatibility-version=19.38" `
            "-DCMAKE_CXX_FLAGS=/clang:-fms-compatibility-version=19.38" `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF

          if ($LASTEXITCODE -ne 0) {
            throw (
              "CMake clang-cl ABI probe configure thất bại: $LASTEXITCODE. " +
              "Dừng trước project thật."
            )
          }

          cmake --build $probeBuild --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "CMake clang-cl ABI probe build thất bại: $LASTEXITCODE"
          }

          $probeExe = Join-Path $probeBuild 'clangcl_probe.exe'

          if (!(Test-Path -LiteralPath $probeExe)) {
            throw 'CMake ABI probe không tạo được clangcl_probe.exe.'
          }

          & $probeExe

          if ($LASTEXITCODE -ne 0) {
            throw "CMake ABI probe runtime thất bại: $LASTEXITCODE"
          }

          $compilerFile = Get-ChildItem `
            -LiteralPath (Join-Path $probeBuild 'CMakeFiles') `
            -Filter 'CMakeCXXCompiler.cmake' `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $compilerFile) {
            throw 'Không tìm thấy CMakeCXXCompiler.cmake của probe.'
          }

          $compilerInfo = Get-Content -LiteralPath $compilerFile.FullName -Raw

          if ($compilerInfo -notmatch 'set\(CMAKE_CXX_SIMULATE_ID "MSVC"\)') {
            throw 'Probe không ghi CMAKE_CXX_SIMULATE_ID=MSVC.'
          }

          if ($compilerInfo -notmatch 'set\(CMAKE_CXX_SIMULATE_VERSION "19\.38') {
            throw 'Probe không ghi CMAKE_CXX_SIMULATE_VERSION=19.38.x.'
          }

          Write-Host 'CMake clang-cl ABI/compiler-ID probe: OK'

      # ============================================================
      # 8B. CONFIGURE REAL PROJECT
      # ============================================================

      - name: Configure with Akira clang-cl
        run: |
          $ErrorActionPreference = 'Stop'

          $freshEnv = cmd.exe /d /s /c "`"$env:VCVARS64`" >nul 2>&1 && set"

          foreach ($line in $freshEnv) {
            if ($line -match '^([^=]+)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable(
                $Matches[1], $Matches[2]
              )
            }
          }

          if (
            [string]::IsNullOrWhiteSpace($env:VCToolsVersion) -or
            !$env:VCToolsVersion.StartsWith("$env:MSVC_TOOLSET_VERSION.")
          ) {
            throw (
              "MSVC toolset sau re-apply không đúng. " +
              "Expected=$env:MSVC_TOOLSET_VERSION.x Actual=$env:VCToolsVersion"
            )
          }

          Write-Host "MSVC env OK. VCToolsVersion=$env:VCToolsVersion"
          Write-Host "VCToolsInstallDir=$env:VCToolsInstallDir"

          Set-Location -LiteralPath $env:PROJECT_DIR

          if (Test-Path -LiteralPath 'build') {
            Remove-Item -LiteralPath 'build' -Recurse -Force
          }

          $inject = Join-Path `
            $env:RUNNER_TEMP `
            'SpecialReload_AkiraInject.cmake'

          @'
          # CMake compiler detection must stay unobfuscated.
          if(PROJECT_NAME STREQUAL "CMAKE_TRY_COMPILE")
            return()
          endif()

          if(DEFINED SPECIALRELOAD_AKIRA_INJECTED)
            return()
          endif()

          if(NOT CMAKE_CXX_COMPILER_ID STREQUAL "Clang")
            message(FATAL_ERROR "Akira injection expected Clang.")
          endif()

          if(NOT CMAKE_CXX_SIMULATE_ID STREQUAL "MSVC")
            message(FATAL_ERROR "Akira injection expected MSVC ABI simulation.")
          endif()

          if(NOT CMAKE_CXX_COMPILER_FRONTEND_VARIANT STREQUAL "MSVC")
            message(FATAL_ERROR "Akira injection expected MSVC-like frontend.")
          endif()

          if(NOT MSVC_VERSION EQUAL 1938)
            message(FATAL_ERROR "Akira injection expected MSVC_VERSION 1938, actual=${MSVC_VERSION}")
          endif()

          set(
            SPECIALRELOAD_AKIRA_INJECTED
            TRUE
            CACHE INTERNAL
            "Akira flags injected after compiler detection"
          )

          # Add any include roots resolved by the workflow. This happens after
          # compiler detection but before targets are created in CMakeLists.txt.
          if(
            DEFINED ENV{SPECIALRELOAD_EXTRA_INCLUDE_DIRS}
            AND NOT "$ENV{SPECIALRELOAD_EXTRA_INCLUDE_DIRS}" STREQUAL ""
          )
            set(
              _specialreload_extra_include_dirs
              "$ENV{SPECIALRELOAD_EXTRA_INCLUDE_DIRS}"
            )

            include_directories(
              BEFORE
              ${_specialreload_extra_include_dirs}
            )

            message(
              STATUS
              "SpecialReloadClient resolved include dirs: ${_specialreload_extra_include_dirs}"
            )
          endif()

          # Keep all repeated -mllvm pairs together through CMake de-duplication.
          add_compile_options(
            "$<$<COMPILE_LANGUAGE:CXX>:SHELL:/clang:-mllvm /clang:-irobf-indbr /clang:-mllvm /clang:-irobf-icall /clang:-mllvm /clang:-irobf-indgv /clang:-mllvm /clang:-irobf-cse /clang:-mllvm /clang:-irobf-cff>"
          )

          message(STATUS "SpecialReloadClient Akira target flags injected AFTER compiler detection")
          '@ |
            Out-File `
              -LiteralPath $inject `
              -Encoding utf8

          # CRITICAL:
          # CMAKE_C/CXX_FLAGS contain ONLY compatibility info.
          # Akira flags are injected after project() enables the compilers.
          cmake `
            -S . `
            -B build `
            -G Ninja `
            "-DCMAKE_BUILD_TYPE=${{ inputs.build_config }}" `
            "-DCMAKE_C_COMPILER=$env:AKIRA_CLANGCL" `
            "-DCMAKE_CXX_COMPILER=$env:AKIRA_CLANGCL" `
            "-DCMAKE_C_FLAGS=/clang:-fms-compatibility-version=19.38" `
            "-DCMAKE_CXX_FLAGS=/clang:-fms-compatibility-version=19.38" `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=OFF `
            "-DCMAKE_PROJECT_INCLUDE=$inject" `
            -DBUILD_TESTING=ON

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure với Akira clang-cl thất bại: $LASTEXITCODE"
          }

      - name: Verify CMake selected Akira and post-detection injection
        run: |
          $ErrorActionPreference = 'Stop'

          $buildDir = Join-Path $env:PROJECT_DIR 'build'
          $cache = Join-Path $buildDir 'CMakeCache.txt'

          if (!(Test-Path -LiteralPath $cache)) {
            throw 'CMakeCache.txt không tồn tại.'
          }

          $cacheLines = Get-Content -LiteralPath $cache
          $content = $cacheLines -join "`n"

          $compilerLine = $cacheLines |
            Where-Object {
              $_ -match '^CMAKE_CXX_COMPILER(?::[^=]+)?='
            } |
            Select-Object -First 1

          if ($null -eq $compilerLine) {
            throw 'Không đọc được CMAKE_CXX_COMPILER từ CMakeCache.txt.'
          }

          $actualCompiler = (
            $compilerLine -replace '^[^=]+=', ''
          ).Trim().Replace('/', '\')

          $expectedCompiler = (
            Join-Path $env:AKIRA_INSTALL 'bin\clang-cl.exe'
          ).Replace('/', '\')

          if (
            ![string]::Equals(
              $actualCompiler,
              $expectedCompiler,
              [System.StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw (
              "CMake KHÔNG dùng Akira clang-cl. " +
              "Expected=$expectedCompiler Actual=$actualCompiler"
            )
          }

          # Base flags must not contain obfuscation.
          $baseFlagsLines = $cacheLines |
            Where-Object {
              $_ -match '^CMAKE_(C|CXX)_FLAGS:'
            }

          foreach ($line in $baseFlagsLines) {
            if ($line -match 'irobf-') {
              throw (
                "Akira flags vẫn lọt vào CMAKE_*_FLAGS và có thể phá CompilerId: " +
                $line
              )
            }
          }

          if ($content -notmatch 'SPECIALRELOAD_AKIRA_INJECTED:INTERNAL=TRUE') {
            throw 'CMake project include chưa inject Akira target flags.'
          }

          $compilerFile = Get-ChildItem `
            -LiteralPath (Join-Path $buildDir 'CMakeFiles') `
            -Filter 'CMakeCXXCompiler.cmake' `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -eq $compilerFile) {
            throw 'Không tìm thấy CMakeCXXCompiler.cmake.'
          }

          $compilerInfo = Get-Content -LiteralPath $compilerFile.FullName -Raw

          foreach ($required in @(
            'set(CMAKE_CXX_COMPILER_ID "Clang")',
            'set(CMAKE_CXX_SIMULATE_ID "MSVC")'
          )) {
            if (!$compilerInfo.Contains($required)) {
              throw "Compiler info thiếu: $required"
            }
          }

          if ($compilerInfo -notmatch 'set\(CMAKE_CXX_SIMULATE_VERSION "19\.38') {
            throw 'CMake không detect được MSVC simulate version 19.38.x.'
          }

          $ninja = Join-Path $buildDir 'build.ninja'

          if (!(Test-Path -LiteralPath $ninja)) {
            throw 'build.ninja không tồn tại.'
          }

          $ninjaText = Get-Content -LiteralPath $ninja -Raw

          foreach ($flag in @(
            '-irobf-indbr',
            '-irobf-icall',
            '-irobf-indgv',
            '-irobf-cse',
            '-irobf-cff'
          )) {
            if (!$ninjaText.Contains($flag)) {
              throw "build.ninja thiếu Akira target flag: $flag"
            }
          }

          # Known MSVC-only switches must not reach clang-cl.
          $badBuildFlags = @(
            '/Zc:preprocessor',
            '/GL',
            '/LTCG'
          )

          foreach ($badFlag in $badBuildFlags) {
            if (
              $ninjaText.IndexOf(
                $badFlag,
                [System.StringComparison]::OrdinalIgnoreCase
              ) -ge 0
            ) {
              throw (
                "build.ninja vẫn chứa MSVC-only flag không hợp với clang-cl: " +
                $badFlag
              )
            }
          }

          Write-Host 'Known MSVC-only clang-cl flags in build.ninja: NONE'

          if (
            ![string]::IsNullOrWhiteSpace(
              $env:SPECIALRELOAD_EXTRA_INCLUDE_DIRS
            )
          ) {
            $resolvedIncludeDirs = @(
              $env:SPECIALRELOAD_EXTRA_INCLUDE_DIRS -split ';' |
                Where-Object {
                  ![string]::IsNullOrWhiteSpace($_)
                }
            )

            foreach ($dir in $resolvedIncludeDirs) {
              $slashPath = $dir.Replace('\', '/')
              $backPath = $dir.Replace('/', '\')

              if (
                !$ninjaText.Contains($slashPath) -and
                !$ninjaText.Contains($backPath)
              ) {
                throw (
                  "Resolved include dir không xuất hiện trong build.ninja: " +
                  $dir
                )
              }
            }

            Write-Host 'Resolved local include dirs in build.ninja: PRESENT'
          }

          # CMake's own detection/try_compile commands must not be obfuscated.
          $configureLog = Get-ChildItem `
            -LiteralPath (Join-Path $buildDir 'CMakeFiles') `
            -Filter 'CMakeConfigureLog.yaml' `
            -File `
            -Recurse |
            Select-Object -First 1

          if ($null -ne $configureLog) {
            $logText = Get-Content -LiteralPath $configureLog.FullName -Raw

            if ($logText -match 'irobf-') {
              throw (
                "Akira flags xuất hiện trong CMake configure/try_compile log. " +
                "Compiler detection chưa được cách ly hoàn toàn."
              )
            }
          }

          Write-Host 'CMake compiler ID: Clang + MSVC ABI 19.38 OK'
          Write-Host 'CMake probes: NO Akira flags'
          Write-Host 'Real target build.ninja: all 5 Akira flags PRESENT'

      # ============================================================
      # 9. BUILD / TEST
      # ============================================================

      - name: Build ${{ inputs.build_config }}
        run: |
          $ErrorActionPreference = 'Stop'

          Set-Location -LiteralPath $env:PROJECT_DIR

          cmake `
            --build build `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "SpecialReloadClient build thất bại: $LASTEXITCODE"
          }

          $exe = Get-ChildItem `
            -LiteralPath 'build' `
            -Filter 'SpecialReloadClient.exe' `
            -File `
            -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/]CMakeFiles[\\/]'
            } |
            Sort-Object FullName |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw 'Build xong nhưng không thấy SpecialReloadClient.exe.'
          }

          if ($exe.Length -le 1024) {
            throw "SpecialReloadClient.exe bất thường: $($exe.Length) bytes."
          }

          "EXE_PATH=$($exe.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "EXE: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Run self-test
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:EXE_PATH --self-test

          if ($LASTEXITCODE -ne 0) {
            throw "--self-test thất bại: $LASTEXITCODE"
          }

          Write-Host 'Self-test: OK'

      - name: Run CTest suite
        run: |
          $ErrorActionPreference = 'Stop'

          Set-Location -LiteralPath (
            Join-Path $env:PROJECT_DIR 'build'
          )

          ctest `
            --output-on-failure `
            --no-tests=warn.

          if ($LASTEXITCODE -ne 0) {
            throw "CTest thất bại: $LASTEXITCODE"
          }

      # ============================================================
      # 10. BINARY SECURITY GATE
      # ============================================================

      - name: Security gate - plaintext, x64 PE, CLR and PDB
        run: |
          $ErrorActionPreference = 'Stop'

          # --------------------------------------------------------
          # ASCII + UTF-16LE plaintext leak scan
          # --------------------------------------------------------

          $bytes = [System.IO.File]::ReadAllBytes($env:EXE_PATH)
          $ascii = [System.Text.Encoding]::Latin1.GetString($bytes)
          $wide = [System.Text.Encoding]::Unicode.GetString($bytes)

          $forbidden = @(
            '/api/specialreload/register',
            '/api/specialreload/poll',
            '/api/specialreload/status',
            'X-ICM-Client-Token'
          )

          $leaked = @()

          foreach ($needle in $forbidden) {
            if ($ascii.Contains($needle) -or $wide.Contains($needle)) {
              $leaked += $needle
            }
          }

          if ($leaked.Count -gt 0) {
            throw "Phát hiện plaintext trong EXE: $($leaked -join ', ')"
          }

          Write-Host 'Plaintext API surface: OK'

          # --------------------------------------------------------
          # Locate dumpbin from VS2022
          # --------------------------------------------------------

          $dumpbinPath = Join-Path `
            $env:VCToolsInstallDir `
            'bin\Hostx64\x64\dumpbin.exe'

          if (!(Test-Path -LiteralPath $dumpbinPath)) {
            throw "Không tìm thấy x64 dumpbin.exe: $dumpbinPath"
          }

          $dumpbin = Get-Item -LiteralPath $dumpbinPath

          $headers = & $dumpbin.FullName `
            /headers `
            $env:EXE_PATH 2>&1

          if ($LASTEXITCODE -ne 0) {
            throw 'dumpbin /headers thất bại.'
          }

          $headerText = $headers -join "`n"

          if ($headerText -notmatch '8664 machine \(x64\)') {
            throw 'EXE không phải PE x64.'
          }

          Write-Host 'PE architecture: x64 OK'

          # COM Descriptor data directory phải có RVA/size = 0.
          $comMatch = $headers |
            Select-String -Pattern 'COM Descriptor Directory' |
            Select-Object -First 1

          if ($null -eq $comMatch) {
            throw 'Không tìm thấy COM Descriptor Directory trong PE headers.'
          }

          $comLine = $comMatch.Line

          if (
            $comLine -match
            '^\s*([0-9A-Fa-f]+)\s+\[\s*([0-9A-Fa-f]+)\s*\].*COM Descriptor Directory'
          ) {
            $comRva = [Convert]::ToUInt64($Matches[1], 16)
            $comSize = [Convert]::ToUInt64($Matches[2], 16)

            if ($comRva -ne 0 -or $comSize -ne 0) {
              throw "EXE có CLR COM Descriptor: RVA=$comRva SIZE=$comSize"
            }
          }
          else {
            throw "Không parse được COM Descriptor line: $comLine"
          }

          $imports = & $dumpbin.FullName `
            /imports `
            $env:EXE_PATH 2>&1

          if ($LASTEXITCODE -ne 0) {
            throw 'dumpbin /imports thất bại.'
          }

          if (($imports -join "`n") -match '(?i)mscoree\.dll') {
            throw 'EXE import mscoree.dll — managed CLR detected.'
          }

          Write-Host 'Native PE / CLR gate: OK'

          # Không cho PDB cạnh EXE.
          $exeDir = Split-Path -Parent $env:EXE_PATH

          $pdbs = Get-ChildItem `
            -LiteralPath $exeDir `
            -Filter '*.pdb' `
            -File `
            -ErrorAction SilentlyContinue

          if ($pdbs) {
            throw "Có PDB cạnh EXE: $(($pdbs.Name) -join ', ')"
          }

          Write-Host 'PDB leak gate: OK'

          $preSignHash = Get-FileHash `
            -LiteralPath $env:EXE_PATH `
            -Algorithm SHA256

          Write-Host "Pre-sign EXE SHA256: $($preSignHash.Hash)"

      # ============================================================
      # 11. OPTIONAL AUTHENTICODE SIGNING
      #
      # Không dùng secrets.* trực tiếp trong "if:".
      # ============================================================

      - name: Detect code-signing configuration
        id: signing
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $hasPfx = ![string]::IsNullOrWhiteSpace($env:CODE_SIGN_PFX)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:CODE_SIGN_PASSWORD)

          if ($hasPfx -and $hasPassword) {
            'enabled=true' |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            Write-Host 'Authenticode signing: ENABLED'
          }
          elseif (!$hasPfx -and !$hasPassword) {
            'enabled=false' |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            Write-Host 'Authenticode signing: SKIPPED'
          }
          else {
            throw 'Phải cấu hình cả CODE_SIGN_PFX và CODE_SIGN_PASSWORD, hoặc bỏ cả hai.'
          }

      - name: Authenticode sign
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $pfxPath = Join-Path `
            $env:RUNNER_TEMP `
            'SpecialReloadClient_codesign.pfx'

          try {
            try {
              $pfxBytes = [Convert]::FromBase64String(
                $env:CODE_SIGN_PFX
              )
            }
            catch {
              throw 'CODE_SIGN_PFX không phải Base64 PFX hợp lệ.'
            }

            [System.IO.File]::WriteAllBytes(
              $pfxPath,
              $pfxBytes
            )

            $kitsRoot = Join-Path `
              ${env:ProgramFiles(x86)} `
              'Windows Kits\10\bin'

            $signtool = Get-ChildItem `
              -LiteralPath $kitsRoot `
              -Filter 'signtool.exe' `
              -File `
              -Recurse |
              Where-Object {
                $_.FullName -match '[\\/]x64[\\/]signtool\.exe$'
              } |
              Sort-Object FullName -Descending |
              Select-Object -First 1

            if ($null -eq $signtool) {
              throw 'Không tìm thấy x64 signtool.exe.'
            }

            $signed = $false

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Signing attempt $attempt/3..."

              & $signtool.FullName sign `
                /f $pfxPath `
                /p $env:CODE_SIGN_PASSWORD `
                /fd SHA256 `
                /tr 'https://timestamp.digicert.com' `
                /td SHA256 `
                $env:EXE_PATH

              if ($LASTEXITCODE -eq 0) {
                $signed = $true
                break
              }

              if ($attempt -lt 3) {
                Start-Sleep -Seconds 5
              }
            }

            if (!$signed) {
              throw 'Authenticode signing thất bại sau 3 lần.'
            }

            & $signtool.FullName verify `
              /pa `
              /all `
              /v `
              $env:EXE_PATH

            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verify thất bại: $LASTEXITCODE"
            }

            Write-Host 'Authenticode signature: VERIFIED'
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      # ============================================================
      # 12. POST-SIGN FINAL TEST
      # ============================================================

      - name: Final executable self-test
        run: |
          $ErrorActionPreference = 'Stop'

          & $env:EXE_PATH --self-test

          if ($LASTEXITCODE -ne 0) {
            throw "Final --self-test thất bại: $LASTEXITCODE"
          }

          Write-Host 'Final executable self-test: OK'

      # ============================================================
      # 13. PACKAGE RELEASE AFTER SIGNING
      # ============================================================

      - name: Package final release
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          $ErrorActionPreference = 'Stop'

          $stageDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            'release-stage'

          if (Test-Path -LiteralPath $stageDir) {
            Remove-Item -LiteralPath $stageDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $stageDir `
            -Force |
            Out-Null

          $releaseExe = Join-Path `
            $stageDir `
            'SpecialReloadClient.exe'

          Copy-Item `
            -LiteralPath $env:EXE_PATH `
            -Destination $releaseExe `
            -Force

          # Chỉ package reloader.cfg nếu không chứa token/MAC thật.
          $cfg = Join-Path $env:PROJECT_DIR 'reloader.cfg'

          if (Test-Path -LiteralPath $cfg) {
            $cfgText = Get-Content -LiteralPath $cfg -Raw

            $secretConfigPatterns = @(
              '(?im)^\s*CLIENT_TOKEN\s*=\s*\S+\s*$',
              '(?im)^\s*CONFIG_MAC\s*=\s*\S+\s*$'
            )

            foreach ($pattern in $secretConfigPatterns) {
              if ($cfgText -match $pattern) {
                throw 'reloader.cfg chứa CLIENT_TOKEN/CONFIG_MAC thật. Không package secret vào artifact.'
              }
            }

            Copy-Item `
              -LiteralPath $cfg `
              -Destination $stageDir `
              -Force
          }

          foreach ($doc in @(
            'README_HARDENING.md',
            'HARDENING_ADDENDUM.md'
          )) {
            $docPath = Join-Path $env:PROJECT_DIR $doc

            if (Test-Path -LiteralPath $docPath) {
              Copy-Item `
                -LiteralPath $docPath `
                -Destination $stageDir `
                -Force
            }
          }

          # Hash phải tính SAU signing.
          $exeHash = Get-FileHash `
            -LiteralPath $releaseExe `
            -Algorithm SHA256

          "$($exeHash.Hash)  SpecialReloadClient.exe" |
            Out-File `
              (Join-Path $stageDir 'SHA256SUMS.txt') `
              -Encoding ascii

          $signedState = if ($env:SIGNING_ENABLED -eq 'true') {
            'YES'
          }
          else {
            'NO'
          }

          @"
          SpecialReloadClient Hardened Release

          Platform: Windows x64
          Build configuration: ${{ inputs.build_config }}
          Compiler: Akira LLVM17 / clang-cl (MSVC 14.38, DIA SDK disabled)
          Akira commit: $env:AKIRA_COMMIT
          Authenticode signed: $signedState

          Obfuscation:
          - indirect branches
          - indirect calls
          - indirect globals
          - C-string encryption
          - control-flow flattening

          Source ZIP SHA256:
          $env:SOURCE_ZIP_SHA256

          Final SpecialReloadClient.exe SHA256:
          $($exeHash.Hash)
          "@ |
            Out-File `
              (Join-Path $stageDir 'RELEASE_INFO.txt') `
              -Encoding utf8

          # Không để PDB lọt vào staging.
          $stagePdb = Get-ChildItem `
            -LiteralPath $stageDir `
            -Filter '*.pdb' `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue

          if ($stagePdb) {
            throw 'PDB bị đưa vào release staging.'
          }

          $zip = Join-Path `
            $env:GITHUB_WORKSPACE `
            'SpecialReloadClient_AkiraLLVM17_release.zip'

          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }

          Compress-Archive `
            -Path (Join-Path $stageDir '*') `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path -LiteralPath $zip)) {
            throw 'Không tạo được release ZIP.'
          }

          $zipSize = (Get-Item -LiteralPath $zip).Length

          if ($zipSize -le 1024) {
            throw "Release ZIP bất thường: $zipSize bytes."
          }

          $zipHash = Get-FileHash `
            -LiteralPath $zip `
            -Algorithm SHA256

          "$($zipHash.Hash)  SpecialReloadClient_AkiraLLVM17_release.zip" |
            Out-File `
              (Join-Path $env:GITHUB_WORKSPACE 'SpecialReloadClient_AkiraLLVM17_release.zip.sha256') `
              -Encoding ascii

          "OUTPUT_ZIP=$zip" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          "OUTPUT_ZIP_SHA256=$(Join-Path $env:GITHUB_WORKSPACE 'SpecialReloadClient_AkiraLLVM17_release.zip.sha256')" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ''
          Write-Host '========================================'
          Write-Host 'SPECIALRELOADCLIENT FINAL RELEASE'
          Write-Host '========================================'
          Write-Host "Akira commit : $env:AKIRA_COMMIT"
          Write-Host 'Compiler     : Akira LLVM17 clang-cl'
          Write-Host 'Obfuscated   : YES'
          Write-Host "Signed       : $signedState"
          Write-Host "EXE SHA256   : $($exeHash.Hash)"
          Write-Host "ZIP SHA256   : $($zipHash.Hash)"
          Write-Host "ZIP size     : $zipSize bytes"
          Write-Host '========================================'

      # ============================================================
      # 14. VERIFY PACKAGED ZIP
      # ============================================================

      - name: Verify final ZIP
        run: |
          $ErrorActionPreference = 'Stop'

          if (!(Test-Path -LiteralPath $env:OUTPUT_ZIP)) {
            throw 'OUTPUT_ZIP không tồn tại.'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            $env:OUTPUT_ZIP
          )

          try {
            $names = @(
              $archive.Entries |
              ForEach-Object {
                $_.FullName
              }
            )

            foreach ($required in @(
              'SpecialReloadClient.exe',
              'SHA256SUMS.txt',
              'RELEASE_INFO.txt'
            )) {
              if ($names -notcontains $required) {
                throw "Release ZIP thiếu $required"
              }
            }

            $badPdb = $names |
              Where-Object {
                $_ -match '(?i)\.pdb$'
              }

            if ($badPdb) {
              throw "Release ZIP chứa PDB: $($badPdb -join ', ')"
            }

            Write-Host 'Final ZIP verification: OK'
          }
          finally {
            $archive.Dispose()
          }

      # ============================================================
      # 15. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload hardened artifact
        uses: actions/upload-artifact@v6
        with:
          name: SpecialReloadClient-AkiraLLVM17-${{ inputs.build_config }}
          path: |
            ${{ env.OUTPUT_ZIP }}
            ${{ env.OUTPUT_ZIP_SHA256 }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
