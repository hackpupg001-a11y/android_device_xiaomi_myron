name: Build EAS Fault Insight EXE from Google Drive

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive file ID hoặc link chia sẻ ZIP source EAS Fault"
        required: true
        type: string
      python_version:
        description: "Python dùng để build"
        required: true
        default: "3.11"
        type: choice
        options:
          - "3.11"
          - "3.12"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python without cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          architecture: x64
          # KHÔNG bật cache:pip ở đây vì repo GitHub có thể không có requirements.txt.
          # Source thật được tải từ Google Drive ở bước sau.

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install gdown nuitka ordered-set zstandard
          python -m pip install Flask pandas numpy openpyxl xlrd pillow requests waitress

      - name: Download source ZIP from Google Drive
        shell: pwsh
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          $driveInput = $env:DRIVE_URL.Trim()
          if ($driveInput -match '^[A-Za-z0-9_-]{20,}$') {
            $fileId = $driveInput
          } elseif ($driveInput -match '/d/([A-Za-z0-9_-]+)') {
            $fileId = $Matches[1]
          } elseif ($driveInput -match '[?&]id=([A-Za-z0-9_-]+)') {
            $fileId = $Matches[1]
          } else {
            throw "Không lấy được Google Drive file ID từ drive_url."
          }

          python -c "import gdown,sys; p=gdown.download(id=sys.argv[1], output='source.zip', quiet=False); raise SystemExit(0 if p else 1)" "$fileId"
          if (!(Test-Path source.zip)) { throw "Không tải được source.zip" }

          New-Item -ItemType Directory -Path source -Force | Out-Null
          Expand-Archive source.zip source -Force

      - name: Locate Flask project
        shell: pwsh
        run: |
          $main = Get-ChildItem source -Filter app.py -File -Recurse |
            Where-Object { $_.Directory.Name -ne '__pycache__' } |
            Sort-Object { $_.FullName.Length } |
            Select-Object -First 1
          if ($null -eq $main) { throw "Không tìm thấy app.py trong ZIP Drive" }

          $project = $main.Directory.FullName
          "PROJECT_DIR=$project" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project: $project"
          Get-ChildItem $project | Select-Object Name,Length,Mode | Format-Table -AutoSize

      - name: Install project requirements if available
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          if (Test-Path requirements.txt) {
            python -m pip install -r requirements.txt
          }
          if (Test-Path requirements-build.txt) {
            python -m pip install -r requirements-build.txt
          }

      - name: Build EAS Fault Web EXE
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m nuitka app.py `
            --standalone `
            --mingw64 `
            --assume-yes-for-downloads `
            --output-dir=build_eas `
            --output-filename=EAS_Fault_Insight.exe `
            --include-package=flask `
            --include-package=jinja2 `
            --include-package=werkzeug `
            --include-package=pandas `
            --include-package=numpy `
            --include-package=openpyxl `
            --include-package=xlrd `
            --include-package=PIL `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=numpy.tests `
            --windows-console-mode=force

      - name: Package standalone output
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR

          $exe = Get-ChildItem build_eas -Filter EAS_Fault_Insight.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "Không tìm thấy EAS_Fault_Insight.exe" }
          $dist = $exe.Directory.FullName

          foreach ($dir in @('templates', 'static', 'data', 'uploads', 'config')) {
            if (Test-Path $dir) { Copy-Item $dir $dist -Recurse -Force }
          }
          foreach ($file in @('.env', 'requirements.txt', 'START_FAST.cmd', 'START_EAS_WEB.cmd')) {
            if (Test-Path $file) { Copy-Item $file $dist -Force }
          }

          $startFile = Join-Path $dist 'START_EAS_FAULT_EXE.cmd'
          @'
@echo off
chcp 65001 >nul
cd /d "%~dp0"
title EAS Fault Insight EXE
start "" powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 2; Start-Process 'http://127.0.0.1:5000'"
"%~dp0EAS_Fault_Insight.exe"
pause
'@ | Set-Content -Path $startFile -Encoding UTF8

          $zip = Join-Path $env:GITHUB_WORKSPACE 'EAS_Fault_Insight_Standalone.zip'
          Compress-Archive (Join-Path $dist '*') $zip -CompressionLevel Optimal
          "OUT_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EAS-Fault-Insight-Standalone
          path: ${{ env.OUT_ZIP }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          
